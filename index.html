<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hotaru</title>
    <meta name="theme-color" content="#0e1430" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hotaru" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <!-- iPad launch images (landscape) -->
    <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2360x1640.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2388x1668.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2732x2048.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2160x1620.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2048x1536.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" href="./icons/launch-2266x1488.png" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #0e1430; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: none;
      }
      body { position: fixed; inset: 0; }
      canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
      #ui { image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: auto; }
      #safe { position: fixed; visibility: hidden; pointer-events: none;
        top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
      noscript { color: #ffe6a3; font: 16px monospace; position: fixed; inset: 40% 0 auto 0; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="ui"></canvas>
    <div id="safe"></div>
    <noscript>Hotaru needs JavaScript and WebGL2.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
